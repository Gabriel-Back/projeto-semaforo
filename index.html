<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="assets/css/main.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"
            type="text/javascript"></script>

    <script src="/assets/js/mqtt.js" type="text/javascript"></script>
    <script src="assets/js/semaforo.js" defer></script>
    <script src="assets/js/storageLocal.js" defer></script>

    <script>
        var l;
        var s;

        window.onload = () => {
            s = new Semaforo();
            l = new storageLocal();
            
            l.recuperarDoLocalStorage(); 
        };
    </script>

    <title>Aula 02</title>
</head>
<body>
    <div class="page-shell">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    <div class="panel-card shadow-lg border-0 rounded-4">
                        <div class="text-center mb-4">
                            <span class="eyebrow">Controle de tráfego</span>
                            <h1 class="page-title mb-0">Semáforo</h1>
                        </div>

                        <div class="row align-items-center g-4">
                            <div class="col-md-5">
                                <div class="semaforo-estrutura">
                                    <div class="poste"></div>
                                    <div class="semaforo-caixa">
                                        <div id="ledVermelho" class="lampada lampada-vermelha" aria-label="Luz vermelha"></div>
                                        <div id="ledAmarelo" class="lampada lampada-amarela" aria-label="Luz amarela"></div>
                                        <div id="ledVerde" class="lampada lampada-verde" aria-label="Luz verde"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-7">
                                <div class="config-panel">
                                    <div class="mb-3">
                                        <label for="tempoVermelho" class="form-label">Tempo vermelho (ms)</label>
                                        <input id="tempoVermelho" name="tempoVermelho" type="number" class="form-control" onkeyup="l.guardarDados()">
                                    </div>

                                    <div class="mb-3">
                                        <label for="tempoAmarelo" class="form-label">Tempo amarelo (ms)</label>
                                        <input id="tempoAmarelo" name="tempoAmarelo" type="number" class="form-control" onkeyup="l.guardarDados()">
                                    </div>

                                    <div class="mb-3">
                                        <label for="tempoVerde" class="form-label">Tempo verde (ms)</label>
                                        <input id="tempoVerde" name="tempoVerde" type="number" class="form-control" onkeyup="l.guardarDados()">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="buttons-container d-flex flex-wrap justify-content-center gap-2 mt-4">
                            <button type="button" class="btn btn-primary btn-custom" onclick="s.aplicarTempos()">Aplicar tempos</button>
                            <button type="button" class="btn btn-success btn-custom" onclick="s.run()">Iniciar semáforo</button>
                            <button type="button" class="btn btn-warning btn-custom text-dark" onclick="s.ligarIntermitente()">Intermitente</button>
                            <button type="button" class="btn btn-outline-dark btn-custom" onclick="s.parar()">Parar</button>
                            <button type="button" class="btn btn-secondary btn-custom" onclick="s.reset()">Reset</button>
                        </div>

                        <div id="mqtt-message"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
