<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Editar configuração de semáforo" />
  <title>Semáforo | Editar cadastro</title>

  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>

<body>
  <admin-layout></admin-layout>

  <div class="admin-main">
      <!-- barra de navegação superior -->
      <nav class="navbar admin-navbar navbar-expand bg-white">
        <div class="container-fluid px-3 px-lg-4">
          <a class="btn btn-outline-secondary btn-sm" href="index.html"><i class="bi bi-arrow-left"
              aria-hidden="true"></i> Voltar</a>
          <div class="navbar-actions ms-auto">
            <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema"
              title="Alternar tema">
              <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </nav>
      <!-- fim barra de navegação superior -->

      <!-- conteúdo principal -->
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <!-- cabeçalho da página -->
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-stoplights" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Gestão operacional</p>
                <h1 class="h3 mb-1">Editar cadastro</h1>
                <p class="text-muted mb-0">
                  Atualize as configurações do semáforo.
                </p>
              </div>
            </div>
          </div>
          <!-- fim cabeçalho da página -->

          <!-- Feedback de operações (sucesso/erro) -->
          <div id="feedback" class="alert d-none" role="status" aria-live="polite"></div>
          <section class="row g-3 mt-1" id="cadastro-form-section">
            <div class="col-12">
              <div class="panel h-100">
                <div class="panel-header">
                  <div>
                    <h2 class="h5 mb-1 section-title">
                      <i class="bi bi-pencil-square" aria-hidden="true"></i><span>Editar cadastro</span>
                    </h2>
                    <p class="text-muted mb-0">Defina os tempos do ciclo.</p>
                  </div>
                </div>

                <!-- formulário de dados do semáforo -->
                <form id="semaforoForm" class="needs-validation" novalidate>
                  <input type="hidden" id="recordId" />

                  <div class="mb-3">
                    <label for="nome" class="form-label">Nome do semáforo</label><input class="form-control" id="nome"
                      required maxlength="60" />
                    <div class="invalid-feedback">Informe um nome.</div>
                  </div>

                  <div class="mb-3">
                    <label for="tempoVermelho" class="form-label">Vermelho (ms)</label><input class="form-control"
                      id="tempoVermelho" type="number" min="100" required />
                    <div class="invalid-feedback">
                      Use um valor a partir de 100 ms.
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="tempoAmarelo" class="form-label">Amarelo (ms)</label><input class="form-control"
                      id="tempoAmarelo" type="number" min="100" required />
                    <div class="invalid-feedback">
                      Use um valor a partir de 100 ms.
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="tempoVerde" class="form-label">Verde (ms)</label><input class="form-control"
                      id="tempoVerde" type="number" min="100" required />
                    <div class="invalid-feedback">
                      Use um valor a partir de 100 ms.
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="latitudeLongitude" class="form-label">Latitude e Longitude do Semáforo</label><input
                      class="form-control" id="latitudeLongitude" type="text" />
                  </div>

                  <div class="form-check form-switch mb-4">
                    <input class="form-check-input" id="ativo" type="checkbox" /><label class="form-check-label"
                      for="ativo">Cadastro ativo</label>
                  </div>

                  <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary" type="submit">
                      <i class="bi bi-check2" aria-hidden="true"></i>
                      Atualizar cadastro</button><a class="btn btn-outline-secondary" href="index.html">Cancelar</a><a
                      class="btn btn-outline-secondary" href="index.html"><i class="bi bi-arrow-left"
                        aria-hidden="true"></i>
                      Voltar</a>
                  </div>
                </form>
                <!-- fim formulário de dados do semáforo -->
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
