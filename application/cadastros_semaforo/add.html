<!doctype html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Cadastro de configurações de semáforo" />
	<title>Semáforo | Cadastros</title>

	<link rel="stylesheet" href="../../assets/css/bootstrap.min.css" />
	<link rel="stylesheet" href="../../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
	<link rel="stylesheet" href="../../assets/css/style.css" />
</head>

<body>
	<admin-layout></admin-layout>

	<div class="admin-main">
			<!-- barra de navegação superior -->
			<nav class="navbar admin-navbar navbar-expand bg-white">
				<div class="container-fluid px-3 px-lg-4">
					<button class="sidebar-toggle" type="button" data-sidebar-toggle aria-controls="adminSidebar"
						aria-expanded="true" aria-label="Alternar menu lateral">
						<span></span><span></span><span></span>
					</button>
					<form class="d-none d-md-flex ms-3 flex-grow-1" role="search" onsubmit="return false">
						<input class="form-control search-input" type="search" placeholder="Buscar configurações"
							aria-label="Buscar configurações" data-table-search="semaforosTable" />
					</form>
					<div class="navbar-actions ms-auto">
						<button class="icon-button theme-toggle" type="button" data-theme-toggle
							aria-label="Alternar tema" title="Alternar tema">
							<i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
						</button>
						<div class="dropdown">
							<button class="profile-button dropdown-toggle" type="button" data-bs-toggle="dropdown"
								aria-expanded="false">
								<img class="avatar-img avatar-sm" src="../../assets/images/avatar/avatar.jpg"
									alt="Administrador" />
								<span class="profile-name d-none d-sm-inline">Administrador</span>
							</button>
							<ul class="dropdown-menu dropdown-menu-end">
								<li>
									<a class="dropdown-item" href="index.html">Cadastros</a>
								</li>
								<li>
									<a class="dropdown-item" href="../simulador/index.html">Simulador</a>
								</li>
							</ul>
						</div>
					</div>
				</div>
			</nav>
			<!-- fim barra de navegação superior -->

			<!-- conteúdo principal -->
			<main class="dashboard-content">
				<div class="container-fluid px-3 px-lg-4 py-4">
					<div class="page-heading">
						<div class="page-heading-copy">
							<span class="page-icon"><i class="bi bi-stoplights" aria-hidden="true"></i></span>
							<div>
								<p class="eyebrow mb-1">Gestão operacional</p>
								<h1 class="h3 mb-1">Cadastros de semáforos</h1>
								<p class="text-muted mb-0">
									Crie, consulte, atualize e remova configurações de ciclo.
								</p>
							</div>
						</div>
					</div>
					<!-- fim cabeçalho da página -->

					<div id="feedback" class="alert d-none" role="status" aria-live="polite"></div>

					<!-- seção do formulário de cadastro -->
					<section class="row g-3 mt-1" id="cadastro-form-section">
						<div class="col-12 col-xl-12">
							<div class="panel h-100">
								<div class="panel-header">
									<div>
										<h2 class="h5 mb-1 section-title">
											<i class="bi bi-pencil-square" aria-hidden="true"></i><span
												id="formTitle">Novo cadastro</span>
										</h2>
										<p class="text-muted mb-0">Defina os tempos do ciclo.</p>
									</div>
								</div>
								<form id="semaforoForm" class="needs-validation" novalidate>
									<input type="hidden" id="recordId" />

									<div class="mb-3">
										<label for="nome" class="form-label">Nome do semáforo</label>
										<input class="form-control" id="nome" required maxlength="60"
											placeholder="Ex.: Avenida Central" onkeyup="" />
										<div class="invalid-feedback">Informe um nome.</div>
									</div>

									<div class="mb-3">
										<label for="tempoVermelho" class="form-label">Vermelho (ms)</label>
										<input class="form-control" id="tempoVermelho" type="number" min="100"
											required />
										<div class="invalid-feedback">
											Use um valor a partir de 100 ms.
										</div>
									</div>

									<div class="mb-3">
										<label for="tempoAmarelo" class="form-label">Amarelo (ms)</label>
										<input class="form-control" id="tempoAmarelo" type="number" min="100"
											required />
										<div class="invalid-feedback">
											Use um valor a partir de 100 ms.
										</div>
									</div>

									<div class="mb-3">
										<label for="tempoVerde" class="form-label">Verde (ms)</label>
										<input class="form-control" id="tempoVerde" type="number" min="100" required />
										<div class="invalid-feedback">
											Use um valor a partir de 100 ms.
										</div>
									</div>

									<div class="mb-3">
										<label for="latitudeLongitude" class="form-label">Latitude e Longitude do
											Semáforo</label>
										<input class="form-control" id="latitudeLongitude" type="text" />
									</div>

									<div class="form-check form-switch mb-4">
										<input class="form-check-input" id="ativo" type="checkbox" checked />
										<label class="form-check-label" for="ativo">Cadastro ativo</label>
									</div>

									<div class="d-flex flex-wrap gap-2">
										<button class="btn btn-primary" type="submit">
											<i class="bi bi-check2" aria-hidden="true"></i>
											<span id="submitLabel">Salvar cadastro</span>
										</button>
										<button class="btn btn-outline-secondary" type="button" data-cancel-edit>
											Limpar
										</button>
										<a class="btn btn-outline-secondary" href="index.html"><i
												class="bi bi-arrow-left" aria-hidden="true"></i>
											Voltar</a>
									</div>

								</form>
							</div>
						</div>
					</section>
					<!-- fim seção do formulário de cadastro -->
				</div>
			</main>
		</div>

	<script src="../../assets/js/bootstrap.bundle.min.js"></script>
	<script src="../../assets/js/layout.js"></script>
	<script src="../../assets/js/main.js"></script>
</body>
</html>
